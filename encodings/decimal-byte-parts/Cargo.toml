[package]
name = "vortex-decimal-byte-parts"
authors = { workspace = true }
categories = { workspace = true }
description = "Vortex decimal array (non-canonical) encodings"
edition = { workspace = true }
homepage = { workspace = true }
include = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[lints]
workspace = true

[features]
# Lower parts make this encoding write more than one child, which readers that predate them
# cannot open. Gated until enough readers understand it.
unstable_encodings = []

[dependencies]
num-traits = { workspace = true }
prost = { workspace = true }
vortex-array = { workspace = true }
vortex-buffer = { workspace = true }
vortex-error = { workspace = true }
vortex-mask = { workspace = true }
vortex-session = { workspace = true }

[dev-dependencies]
divan = { workspace = true }
rand = { workspace = true }
rstest = { workspace = true }
vortex-array = { path = "../../vortex-array", features = ["_test-harness"] }

[[bench]]
name = "decimal_assemble"
harness = false
# Builds multi-part arrays, which the write gate only permits with this feature.
required-features = ["unstable_encodings"]
